services:
    - type: web
    name: excelmergerpro-license
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    autoDeploy: true
    disk:
      name: license-db-disk
      mountPath: /data
      sizeGB: 1
    envVars:
            - key: DATABASE_URL
        value: sqlite:////data/licenses.db
            - key: PYTHON_VERSION
        value: 3.11.0
